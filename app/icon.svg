<svg width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rounded-square border, matches border-[1.5px] border-[#4fffb0] on a 28px (h-7 w-7) box scaled 4x -->
  <rect x="3" y="3" width="106" height="106" rx="24" stroke="#4fffb0" stroke-width="6"/>

  <!-- 2x2 grid of rounded squares, matches p-1 gap-1 rounded-[2px] scaled 4x -->
  <!-- Top-left: full opacity -->
  <rect x="19" y="19" width="34" height="34" rx="8" fill="#4fffb0"/>

  <!-- Top-right: 60% opacity -->
  <rect x="59" y="19" width="34" height="34" rx="8" fill="#4fffb0" fill-opacity="0.6"/>

  <!-- Bottom-left: 40% opacity -->
  <rect x="19" y="59" width="34" height="34" rx="8" fill="#4fffb0" fill-opacity="0.4"/>

  <!-- Bottom-right: 20% opacity -->
  <rect x="59" y="59" width="34" height="34" rx="8" fill="#4fffb0" fill-opacity="0.2"/>
</svg>
